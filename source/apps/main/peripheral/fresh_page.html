<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>小灵 · 灵机一动</title>
<style>body{font:16px system-ui;background:#101922;color:#edf4fa;max-width:820px;margin:24px auto;padding:16px}button,select{padding:10px;margin:4px}img{max-width:100%;background:#223}</style>
<h1>小灵 · 灵机一动</h1><p>PID 11885 · 摄像头预览与控制</p>
<img id="pic" width="240" height="320"><p id="info">等待画面</p>
<select id="quality"><option>55</option><option>70</option><option>85</option></select>
<button id="pause">暂停 / 继续</button><button id="save">保存照片</button>
<p><button data-action="left">左转 300ms</button><button data-action="right">右转 300ms</button><button data-action="track_hand">追踪手</button><button data-action="track_face">追踪脸</button><button data-action="stop">停止</button></p>
<p><button data-action="nod">点头 · GPIO6</button><button data-action="shake">摇头 · GPIO5</button></p>
<p><button data-action="up">向上转 300ms</button><button data-action="down">向下转 300ms</button></p>
<pre id="state"></pre>
<script>
let paused=false,last=0,current=null;
const pic=document.getElementById('pic'),info=document.getElementById('info'),state=document.getElementById('state'),quality=document.getElementById('quality');
document.getElementById('pause').onclick=()=>paused=!paused;
async function loop(){try{if(!paused){const r=await fetch('/frame.jpg?q='+quality.value+'&after='+last,{cache:'no-store'});if(r.ok&&r.status!==204){const b=await r.blob(),u=URL.createObjectURL(b);try{await new Promise((ok,bad)=>{pic.onload=ok;pic.onerror=bad;pic.src=u})}catch(e){URL.revokeObjectURL(u);throw e}if(current)URL.revokeObjectURL(current);current=u;last=r.headers.get('X-Frame-Id');info.textContent='帧 '+last+' · 帧龄 '+r.headers.get('X-Frame-Age-Ms')+' ms'}else if(r.status===503)info.textContent=await r.text()}}catch(e){info.textContent='连接重试：'+e.message}setTimeout(loop,100)}
for(const button of document.querySelectorAll('[data-action]'))button.onclick=async()=>{try{const r=await fetch('/api/control',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:button.dataset.action})});state.textContent=await r.text()}catch(e){state.textContent=e.message}};
document.getElementById('save').onclick=()=>{if(current){const a=document.createElement('a');a.href=current;a.download='xiaoling-'+Date.now()+'.jpg';a.click()}};
loop();setInterval(async()=>{try{state.textContent=await(await fetch('/api/control')).text()}catch(e){}},1000);
</script></html>
